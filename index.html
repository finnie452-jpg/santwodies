<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#000000">

	<title>santwodies</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			background: #000000;
		}

		body {
			min-height: 100vh;
			min-height: 100dvh;

			display: flex;
			align-items: center;
			justify-content: center;

			overflow: hidden;
			background: #000000;
		}

		.main-text {
			color: #ffffff;
			font-family: "Times New Roman", Times, serif;
			font-size: clamp(22px, 4vw, 42px);
			font-weight: normal;
			text-align: center;
			white-space: nowrap;

			cursor: pointer;
			user-select: none;

			transition: color 300ms ease;
		}

		@media (hover: hover) {
			.main-text:hover {
				color: #8b0000;
			}
		}

		@media (max-width: 380px) {
			.main-text {
				font-size: 21px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.main-text {
				transition: none;
			}
		}
	</style>
</head>

<body>
	<main>
		<span class="main-text">Я умер, чтобы воскреснуть</span>
	</main>
</body>
</html>
